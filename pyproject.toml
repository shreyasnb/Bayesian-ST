[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian-st"
version = "1.0.0"
description = "Grassmann Bingham subspace tracking and reproducible simulations"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "scipy>=1.15", "matplotlib>=3.8", "pandas>=2.0"]

[tool.setuptools.packages.find]
include = ["lib*", "benchmarks*"]
