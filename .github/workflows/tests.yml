name: Paper reproduction checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/bayesian-st-matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended cm-super dvipng poppler-utils
      - name: Install numerical environment
        run: bash scripts/setup.sh
      - name: Run focused regression checks
        run: .venv/bin/python -m pytest -q
      - name: Export and verify frozen paper results
        run: |
          .venv/bin/python scripts/export_paper.py
          .venv/bin/python scripts/check_paper.py
